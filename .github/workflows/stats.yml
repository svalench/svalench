name: Update profile stats cards

# Regenerates the SVG cards in /stats from the GitHub API and commits them
# to the repo, so the profile README never depends on third-party badge
# services (their public instances are frequently rate-limited or paused).

on:
  schedule:
    - cron: "23 3 * * *" # daily, UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_stats.py"

permissions:
  contents: write

concurrency:
  group: stats-cards

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_LOGIN: svalench
        run: python scripts/generate_stats.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh profile stats cards [skip ci]"
            git push
          fi
